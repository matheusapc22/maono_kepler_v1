name: Change Request production acceptance

on:
  pull_request:
    branches:
      - mano_kepler_v1
      - feat/viewer-request-tracking
    paths:
      - "scripts/operations/change-request-release-contracts.mjs"
      - "scripts/preview/change-request-acceptance-stream.mjs"
      - "tests/change-request-release-contracts.test.mjs"
      - ".github/workflows/change-request-production-acceptance.yml"
      - "functions/_lib/project-change-request-*.js"
      - "functions/api/health.js"
      - "scripts/operations/change-request-release-migrations.mjs"
      - "scripts/operations/change-request-release-observability.mjs"
      - "scripts/preview/change-request-qa-identity-preflight.mjs"
      - "scripts/preview/change-request-production-acceptance.mjs"
      - "tests/change-request-release-migrations.test.mjs"
      - "tests/change-request-release-gate.test.mjs"
      - "tests/change-request-qa-identity-preflight.test.mjs"
      - "tests/viewer-request-tracking-runtime.test.mjs"
      - "docs/operations/change-request-production-release-gate.md"
      - "docs/operations/change-request-release-runbook.md"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite RUN_QA_CHANGE_REQUEST_ACCEPTANCE para abrir o gate mutável de QA"
        required: true
        type: string
      preview_base_url:
        description: "Origin HTTPS do deployment Preview integrado"
        required: true
        type: string
      production_base_url:
        description: "Origin HTTPS de Production"
        required: true
        type: string
      qa_project_slug:
        description: "Projeto descartável qa-smoke-* dentro de Maõno Preview QA"
        required: true
        type: string
      stale_apply_minutes:
        description: "Idade máxima tolerada para Change Request em applying"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'change-request-d1-rollout' || format('{0}-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate release gate contracts
        run: >-
          node --test
          tests/change-request-release-migrations.test.mjs
          tests/change-request-release-gate.test.mjs
          tests/change-request-qa-identity-preflight.test.mjs
          tests/viewer-request-tracking-runtime.test.mjs
          tests/project-change-request-lifecycle.test.mjs
          tests/change-request-large-apply.test.mjs
          tests/project-change-request-resubmission.test.mjs

      - name: Syntax-check release operators
        run: |
          node --check scripts/operations/change-request-release-migrations.mjs
          node --check scripts/operations/change-request-release-observability.mjs
          node --check scripts/preview/change-request-qa-identity-preflight.mjs
          node --check scripts/preview/change-request-production-acceptance.mjs

      - name: Preview safety remains fail-closed
        run: node scripts/preview/assert-preview-safety.mjs

      - name: Build
        run: npm run build

  acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/ops/change-request-release-acceptance' &&
      inputs.confirmation == 'RUN_QA_CHANGE_REQUEST_ACCEPTANCE'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAONO_PREVIEW_VIEWER_SESSION_COOKIE: ${{ secrets.MAONO_PREVIEW_VIEWER_SESSION_COOKIE }}
      MAONO_PREVIEW_REVIEWER_SESSION_COOKIE: ${{ secrets.MAONO_PREVIEW_REVIEWER_SESSION_COOKIE }}
      MAONO_PREVIEW_BASE_URL: ${{ inputs.preview_base_url }}
      MAONO_PRODUCTION_BASE_URL: ${{ inputs.production_base_url }}
      MAONO_ACCEPTANCE_QA_PROJECT_SLUG: ${{ inputs.qa_project_slug }}
      MAONO_RELEASE_GATE_APPLY_STALE_MINUTES: ${{ inputs.stale_apply_minutes }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout audited release branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify distinct Viewer and Reviewer identities
        run: node scripts/preview/change-request-qa-identity-preflight.mjs

      - name: Pre-acceptance observability
        env:
          MAONO_RELEASE_GATE_PHASE: pre
          MAONO_REQUIRE_PREVIEW_MUTATIONS_ENABLED: "true"
        run: node scripts/operations/change-request-release-observability.mjs

      - name: Authenticated Viewer and Reviewer acceptance
        run: node scripts/preview/change-request-production-acceptance.mjs

      - name: Post-acceptance observability
        if: success()
        env:
          MAONO_RELEASE_GATE_PHASE: post
          MAONO_REQUIRE_PREVIEW_MUTATIONS_ENABLED: "true"
        run: node scripts/operations/change-request-release-observability.mjs

  configuration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit Pages target configuration read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}`;
          async function read(path) {
            const r = await fetch(root + path, {redirect:'manual',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
            if(!r.ok) throw new Error(`Read-only Pages audit failed: HTTP ${r.status}`);
            const data = await r.json();
            if(!data.success) throw new Error('Read-only Pages audit rejected');
            return data.result;
          }
          const pages = await read('/pages/projects/maono-kepler-v1');
          const databases = (await read('/d1/database?per_page=100')).filter(db=>db.name==='maono_maps');
          if(databases.length!==1) throw new Error('Expected unique maono_maps D1');
          for(const environment of ['production','preview']) {
            if(pages.deployment_configs?.[environment]?.d1_databases?.DB?.id!==databases[0].uuid) throw new Error('D1 binding drift');
          }
          if(pages.production_branch!=='mano_kepler_v1') throw new Error('Production branch differs from the functional stack target');
          const vars=pages.deployment_configs.preview.env_vars;
          if(vars.MAONO_RUNTIME_ENV?.value!=='preview' || vars.MAONO_PREVIEW_MUTATIONS_ENABLED?.value!=='false' ||
             vars.MAONO_PREVIEW_QA_ORG_SLUG?.value!=='maono-preview-qa' || vars.MAONO_PREVIEW_QA_ORG_ID?.value!=='9') throw new Error('Preview is not in the expected fail-closed QA configuration');
          for (const name of ['DROPBOX_APP_KEY','DROPBOX_APP_SECRET','DROPBOX_REFRESH_TOKEN']) {
            console.log(JSON.stringify({setting:name,repositorySecretAvailable:Boolean(process.env[name]),previewConfigured:Boolean(vars[name]),productionConfigured:Boolean(pages.deployment_configs.production.env_vars?.[name])}));
          }
          console.log('Read-only audit: Production branch mano_kepler_v1; Preview runtime preview; mutations=false; QA scope and both maono_maps bindings verified.');
          JS
