name: Ticket Center Visual
on:
  pull_request:
    branches: [mano_kepler_v1]
    paths:
      - 'src/main.tsx'
      - 'src/pages/Projects.tsx'
      - 'src/pages/Projects/**'
      - 'src/access-control/**'
      - 'src/auth/session.tsx'
      - 'src/platform-density.css'
      - 'src/platform-layout.css'
      - 'src/maono-design-tokens.css'
      - 'functions/_lib/ticket*.js'
      - 'functions/api/organizations/**/tickets*'
      - 'functions/api/organizations/**/tickets/**'
      - 'tests/ticket*.test.mjs'
      - 'tests/helpers/ticket*.mjs'
      - 'tests/helpers/document-helper-preservation.mjs'
      - 'tests/browser/ticket-center-visual.spec.ts'
      - 'tests/documents-visual-contract.test.mjs'
      - 'tests/project-pages-contract.test.mjs'
      - 'tests/organization-switcher-redesign.test.mjs'
      - 'tests/organization-file-filters.test.mjs'
      - 'playwright.ticket-center.config.ts'
      - 'playwright.project-pages.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ticket-center-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ticket-center:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing repository dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Ticket domains, SQLite HTTP paging, shared footer and preservation contracts
        env:
          PROJECT_PAGES_REQUIRE_BASELINE: "1"
        run: >-
          node --experimental-strip-types --test tests/ticket*.test.mjs
          tests/documents-visual-contract.test.mjs tests/project-pages-contract.test.mjs
          tests/organization-switcher-redesign.test.mjs tests/organization-file-filters.test.mjs
      - name: Scoped lint
        run: >-
          npx eslint src/pages/Projects/components/TicketsSection.tsx
          src/pages/Projects/components/TicketsToolbar.tsx src/pages/Projects/components/TicketListView.tsx
          src/pages/Projects/components/TicketExportsPanel.tsx src/pages/Projects/components/DocumentsPagination.tsx
          tests/browser/ticket-center-visual.spec.ts tests/ticket-center-visual-contract.test.mjs
          tests/ticket-pagination-contract.test.mjs tests/helpers/ticket-visual-preservation.mjs
      - name: Typecheck and build actual application
        env:
          VITE_MAONO_MAP_SHELL_V1: "true"
          VITE_MAONO_LAYER_MANAGER_V1: "true"
          VITE_MAONO_MAP_OVERLAY_V1: "true"
        run: npm run build
      - name: Save compiled application before browser checks
        uses: actions/upload-artifact@v4
        with:
          name: ticket-center-built-app-${{ github.sha }}
          path: dist/
          retention-days: 7
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Compiled Central route with fixture APIs, not production acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ticket-center-results.json
        run: xvfb-run --auto-servernum --server-args="-screen 0 2560x2160x24" npx playwright test --config=playwright.ticket-center.config.ts --reporter=list,json
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-center-${{ github.sha }}
          path: |
            test-results/
            ticket-center-results.json
            tests/browser/ticket-center-visual.spec.ts
            tests/ticket-center-visual-contract.test.mjs
            tests/ticket-pagination-contract.test.mjs
            playwright.ticket-center.config.ts
          if-no-files-found: warn
          retention-days: 14
