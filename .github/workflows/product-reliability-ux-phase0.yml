name: Product Reliability UX Gate

on:
  push:
    branches:
      - "audit/product-reliability-ux-phase0"
      - "feat/prh-*"
    paths:
      - "src/**"
      - "tests/api-error-client.test.mjs"
      - "tests/user-error-catalog.test.mjs"
      - "scripts/audit-user-error-sinks.mjs"
      - "scripts/audit-user-error-sinks.test.mjs"
      - "scripts/user-error-sink-baseline.json"
      - ".github/workflows/product-reliability-ux-phase0.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - "mano_kepler_v1"
    paths:
      - "src/**"
      - "tests/api-error-client.test.mjs"
      - "tests/user-error-catalog.test.mjs"
      - "scripts/audit-user-error-sinks.mjs"
      - "scripts/audit-user-error-sinks.test.mjs"
      - "scripts/user-error-sink-baseline.json"
      - ".github/workflows/product-reliability-ux-phase0.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate error presentation contract
        run: node --test tests/api-error-client.test.mjs tests/user-error-catalog.test.mjs

      - name: Validate audit scanner
        run: node --test scripts/audit-user-error-sinks.test.mjs

      - name: Capture current error-sink inventory
        run: |
          node scripts/audit-user-error-sinks.mjs --json > reliability-error-sinks.json
          node scripts/audit-user-error-sinks.mjs --write-baseline reliability-generated-baseline.json > reliability-error-sinks.txt
          cat reliability-error-sinks.txt
          cat reliability-generated-baseline.json

      - name: Enforce error-sink ratchet
        run: node scripts/audit-user-error-sinks.mjs --baseline scripts/user-error-sink-baseline.json --strict-baseline

      - name: Build application
        run: npm run build

      - name: Upload reliability inventory
        uses: actions/upload-artifact@v4
        with:
          name: product-reliability-ux-${{ github.sha }}
          path: |
            reliability-error-sinks.json
            reliability-generated-baseline.json
          if-no-files-found: error
          retention-days: 30
