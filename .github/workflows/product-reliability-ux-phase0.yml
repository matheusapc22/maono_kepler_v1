name: Product Reliability UX Gate

on:
  push:
    branches:
      - "audit/product-reliability-ux-phase0"
      - "feat/prh-*"
    paths:
      - "src/**"
      - "functions/_lib/organization-*.js"
      - "functions/_lib/dropbox*.js"
      - "functions/api/admin/organizations/**"
      - "functions/api/organizations/**"
      - "workers/organization-storage-recovery.js"
      - ".github/workflows/organization-storage-recovery-operator.yml"
      - "wrangler.organization-storage-recovery.toml.example"
      - "scripts/organization-storage/**"
      - "tests/organization-*.test.mjs"
      - "tests/dropbox-*.test.mjs"
      - "tests/helpers/**"
      - "schema.sql"
      - "tests/api-error-client.test.mjs"
      - "tests/user-error-catalog.test.mjs"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "scripts/audit-user-error-sinks.mjs"
      - "scripts/audit-user-error-sinks.test.mjs"
      - "scripts/user-error-sink-baseline.json"
      - ".github/workflows/product-reliability-ux-phase0.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - "mano_kepler_v1"
    paths:
      - "src/**"
      - "functions/_lib/organization-*.js"
      - "functions/_lib/dropbox*.js"
      - "functions/api/admin/organizations/**"
      - "functions/api/organizations/**"
      - "workers/organization-storage-recovery.js"
      - ".github/workflows/organization-storage-recovery-operator.yml"
      - "wrangler.organization-storage-recovery.toml.example"
      - "scripts/organization-storage/**"
      - "tests/organization-*.test.mjs"
      - "tests/dropbox-*.test.mjs"
      - "tests/helpers/**"
      - "schema.sql"
      - "tests/api-error-client.test.mjs"
      - "tests/user-error-catalog.test.mjs"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "scripts/audit-user-error-sinks.mjs"
      - "scripts/audit-user-error-sinks.test.mjs"
      - "scripts/user-error-sink-baseline.json"
      - ".github/workflows/product-reliability-ux-phase0.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate error presentation contract
        run: node --test tests/api-error-client.test.mjs tests/user-error-catalog.test.mjs

      - name: Validate audit scanner
        run: node --test scripts/audit-user-error-sinks.test.mjs

      - name: Storage, chaos, lifecycle and SLO contract
        run: npm run test:reliability

      - name: Capture current error-sink inventory
        run: |
          node scripts/audit-user-error-sinks.mjs --json > reliability-error-sinks.json
          node scripts/audit-user-error-sinks.mjs --write-baseline reliability-generated-baseline.json > reliability-error-sinks.txt
          cat reliability-error-sinks.txt
          cat reliability-generated-baseline.json

      - name: Enforce error-sink ratchet
        run: node scripts/audit-user-error-sinks.mjs --baseline scripts/user-error-sink-baseline.json --strict-baseline

      - name: Build application
        run: npm run build

      - name: Install Chromium for loading acceptance
        run: npx playwright install --with-deps chromium

      - name: Browser loading and reliability acceptance
        run: npm run test:reliability-browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-browser-failures-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload reliability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-reliability-ux-${{ github.sha }}
          path: |
            reliability-error-sinks.json
            reliability-generated-baseline.json
          if-no-files-found: error
          retention-days: 30
