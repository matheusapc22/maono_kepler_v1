name: Synthetic preflight diagnostic (GET only)
on:
  pull_request:
    paths:
      - 'scripts/d1-synthetic-provision/preflight-diagnostic*.mjs'
      - 'tests/d1-synthetic-preflight-diagnostic.test.mjs'
      - '.github/workflows/d1-synthetic-preflight-diagnostic.yml'
      - 'scripts/d1-remote-audit/owner-review-policy.mjs'
  workflow_dispatch:
    inputs:
      confirmation:
        description: READ_ONLY_SYNTHETIC_PREFLIGHT (no provisioning)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: synthetic-fixed-provision-20261116
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test tests/d1-synthetic-preflight-diagnostic.test.mjs tests/d1-remote-audit-owner-review.test.mjs
  protection:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '172453089' && github.run_attempt == 1 && inputs.confirmation == 'READ_ONLY_SYNTHETIC_PREFLIGHT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify existing owner approval policy without changing access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/environments/synthetic-d1-provision" > environment.json
          node --input-type=module -e "import{readFileSync}from'node:fs';import{assertOwnerReviewPolicy}from'./scripts/d1-remote-audit/owner-review-policy.mjs';const e=JSON.parse(readFileSync('environment.json','utf8'));if(e.name!=='synthetic-d1-provision')throw Error('DENIED');assertOwnerReviewPolicy({...e,name:'synthetic-d1-readonly-audit'},{actorId:process.env.GITHUB_ACTOR_ID,repository:process.env.GITHUB_REPOSITORY});"
  diagnostic:
    needs: [validate, protection]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '172453089' && github.run_attempt == 1 && inputs.confirmation == 'READ_ONLY_SYNTHETIC_PREFLIGHT'
    environment: synthetic-d1-provision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Three fixed inventory GETs with sanitized summaries only
        env:
          MAONO_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
          MAONO_SYNTHETIC_PROVISION_TOKEN: ${{ secrets.MAONO_SYNTHETIC_PROVISION_TOKEN }}
        run: node scripts/d1-synthetic-provision/preflight-diagnostic-runner.mjs
