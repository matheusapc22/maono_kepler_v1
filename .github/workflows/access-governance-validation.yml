name: Access governance validation

on:
  pull_request:
    branches:
      - mano_kepler_v1
    paths:
      - "functions/_lib/access-governance.js"
      - "functions/api/admin/organizations/**"
      - "functions/api/organizations/**"
      - "migrations/0012_access_delegation_policy.sql"
      - "schema.sql"
      - "src/access-control/permissions.ts"
      - "src/pages/Admin/**"
      - "src/pages/Projects/components/UsersAccessSection.tsx"
      - "tests/access-delegation.test.mjs"
      - ".github/workflows/access-governance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Access governance tests
        run: node --test tests/access-delegation.test.mjs
