name: Access governance validation

on:
  pull_request:
    branches:
      - mano_kepler_v1
    paths:
      - "functions/_middleware.js"
      - "functions/_lib/access-governance.js"
      - "functions/_lib/dropbox.js"
      - "functions/_lib/dropbox-content-hash.js"
      - "functions/_lib/dropbox-map-config-repository.js"
      - "functions/_lib/error-*.js"
      - "functions/_lib/http.js"
      - "functions/_lib/maono-error.js"
      - "functions/_lib/result.js"
      - "functions/_lib/map-config-*.js"
      - "functions/_lib/map-load-observability.js"
      - "functions/_lib/preview-write-policy.js"
      - "functions/_lib/runtime-environment.js"
      - "functions/_lib/project-*.js"
      - "functions/_lib/projects.js"
      - "functions/api/health.js"
      - "functions/api/admin/organizations/**"
      - "functions/api/admin/project-previews/**"
      - "functions/api/admin/project-lifecycle/**"
      - "functions/api/observability/**"
      - "functions/api/organizations/**"
      - "functions/api/projects/**"
      - "migrations/0012_access_delegation_policy.sql"
      - "migrations/0015_project_preview_lifecycle.sql"
      - "migrations/0018_project_lifecycle.sql"
      - "docs/architecture/S03-project-lifecycle.md"
      - "docs/architecture/S04-map-config-repository.md"
      - "docs/architecture/S05-atomic-project-revisions.md"
      - "docs/architecture/S06-result-types-error-taxonomy.md"
      - "docs/architecture/S07-map-load-observability.md"
      - "docs/architecture/GATE-A-foundation-stable.md"
      - "docs/architecture/macro-c/**"
      - "docs/operations/production-db-preview-testing.md"
      - "scripts/macro-c-gate.mjs"
      - "scripts/preview/**"
      - "tests/fixtures/maps/**"
      - "tests/macro-c-*.test.mjs"
      - "tests/maono-map-*.test.mjs"
      - "tests/map-migration-registry.test.mjs"
      - "tests/map-domain-kernel.test.mjs"
      - "tests/dataset-*.test.mjs"
      - "tests/map-application-services.test.mjs"
      - "tests/map-engine-port-contract.test.mjs"
      - "tests/preview-*.test.mjs"
      - "schema.sql"
      - "package.json"
      - "wrangler.preview.toml.example"
      - "vite.config.ts"
      - "index.html"
      - "src/main.tsx"
      - "src/lib/api.ts"
      - "src/access-control/permissions.ts"
      - "src/pages/Admin/**"
      - "src/pages/Kepler/**"
      - "src/pages/Projects/**"
      - "tests/access-delegation.test.mjs"
      - "tests/admin-user-manager-delegation-map.test.mjs"
      - "tests/cloudflare-build-chunking.test.mjs"
      - "tests/map-config-*.test.mjs"
      - "tests/map-load-*.test.mjs"
      - "tests/project-*.test.mjs"
      - "tests/error-*.test.mjs"
      - "tests/result-types.test.mjs"
      - "tests/api-error-client.test.mjs"
      - ".github/workflows/access-governance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: access-governance-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Access governance and runtime tests
        run: >-
          node --test
          tests/access-delegation.test.mjs
          tests/admin-user-manager-delegation-map.test.mjs
          tests/cloudflare-build-chunking.test.mjs

      - name: GATE A — Foundation stability
        shell: bash
        run: |
          set -o pipefail
          npm run test:foundation-gate 2>&1 | tee foundation-gate.log

      - name: Upload Foundation Gate diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-log
          path: foundation-gate.log
          if-no-files-found: ignore
          retention-days: 3

      - name: MACRO C — Progressive gate
        run: npm run test:macro-c-gate
