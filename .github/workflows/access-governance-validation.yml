name: Access governance validation

on:
  pull_request:
    branches:
      - mano_kepler_v1
    paths:
      - "functions/_lib/access-governance.js"
      - "functions/api/admin/organizations/**"
      - "functions/api/organizations/**"
      - "migrations/0012_access_delegation_policy.sql"
      - "schema.sql"
      - "package.json"
      - "src/access-control/permissions.ts"
      - "src/pages/Admin/**"
      - "src/pages/Projects/components/UsersAccessSection.tsx"
      - "tests/access-delegation.test.mjs"
      - "tests/admin-user-manager-delegation-map.test.mjs"
      - ".github/workflows/access-governance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: access-governance-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Access governance tests
        run: >-
          node --test
          tests/access-delegation.test.mjs
          tests/admin-user-manager-delegation-map.test.mjs
