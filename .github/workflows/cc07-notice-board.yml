name: CC07 Notice Board
on:
  pull_request:
    branches: [mano_kepler_v1]
    paths:
      - 'src/components/notices/**'
      - 'src/auth/session.tsx'
      - 'src/pages/ProjectsSidebar.tsx'
      - 'src/pages/Kepler/components/maono-map-shell/MapTopbar.tsx'
      - 'src/pages/Projects/components/TicketNotifications.tsx'
      - 'tests/browser/notice-board.spec.ts'
      - 'tests/browser/ticket-notifications.spec.ts'
      - 'tests/browser/fixtures/notice-board*'
      - 'playwright.notices.config.ts'
      - 'vite.notice-board.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/cc07-notice-board.yml'
permissions:
  contents: read
jobs:
  local-browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve the versioned yarn lock and install its npm snapshot
        run: |
          lock_dir=$(mktemp -d "${RUNNER_TEMP}/cc07-lock.XXXXXX")
          cp package.json yarn.lock "$lock_dir/"
          (
            cd "$lock_dir"
            npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
            npm ci --legacy-peer-deps --no-audit --no-fund
          )
          test ! -e node_modules
          mv "$lock_dir/node_modules" ./node_modules
          cp "$lock_dir/package-lock.json" ./package-lock.json
          git diff --exit-code -- package.json yarn.lock
      - name: Record installed SDK versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          console.log('Node', process.version);
          for (const name of ['@kepler.gl/duckdb', '@kepler.gl/utils', '@loaders.gl/schema', 'apache-arrow', 'typescript']) {
            const pkg = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            console.log(name, pkg.version);
          }
          NODE
      - run: node node_modules/typescript/bin/tsc -b --pretty false
      - run: npx eslint src/components/notices tests/browser/notice-board.spec.ts tests/browser/fixtures/notice-board.tsx playwright.notices.config.ts vite.notice-board.config.ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Local mock APIs only; never Production acceptance
        run: npx playwright test --config playwright.notices.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cc07-notice-board-${{ github.sha }}
          path: |
            test-results/
            package-lock.json
          retention-days: 7
