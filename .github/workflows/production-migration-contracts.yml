name: Production migration contracts

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'package.json'
      - 'scripts/migrations/**'
      - 'tests/production-migration-gate.test.mjs'
      - 'tests/production-migration-actions-workflow.test.mjs'
      - '.github/workflows/production-d1-migration-operator.yml'
      - 'docs/runbooks/production-migrations-codex.md'
      - '.github/workflows/production-migration-contracts.yml'
  push:
    branches:
      - mano_kepler_v1
    paths:
      - 'AGENTS.md'
      - 'package.json'
      - 'scripts/migrations/**'
      - 'tests/production-migration-gate.test.mjs'
      - 'tests/production-migration-actions-workflow.test.mjs'
      - '.github/workflows/production-d1-migration-operator.yml'
      - 'docs/runbooks/production-migrations-codex.md'
      - '.github/workflows/production-migration-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check migration operators
        run: |
          node --check scripts/migrations/production-migration-lib.mjs
          node --check scripts/migrations/audit-production.mjs
          node --check scripts/migrations/apply-production.mjs
          node --check scripts/migrations/post-validate-production.mjs
      - name: Validate migration gates
        run: node --test tests/production-migration-gate.test.mjs tests/production-migration-actions-workflow.test.mjs
