name: Production migration contracts

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'package.json'
      - 'schema.sql'
      - 'migrations/**'
      - 'scripts/migrations/**'
      - 'tests/production-migration-gate.test.mjs'
      - 'tests/production-migration-actions-workflow.test.mjs'
      - 'tests/production-migration-organization-schema.test.mjs'
      - 'tests/production-migration-qa-inventory.test.mjs'
      - 'tests/production-migration-identity-*.test.mjs'
      - 'tests/helpers/identity-operator-preload.mjs'
      - 'functions/_lib/organization-name.js'
      - 'docs/runbooks/organization-identity-0043.md'
      - 'docs/runbooks/organization-qa-inventory.md'
      - 'tests/helpers/organization-schema-history.mjs'
      - '.github/workflows/production-d1-migration-operator.yml'
      - 'docs/runbooks/production-migrations-codex.md'
      - '.github/workflows/production-migration-contracts.yml'
  push:
    branches:
      - mano_kepler_v1
    paths:
      - 'AGENTS.md'
      - 'package.json'
      - 'schema.sql'
      - 'migrations/**'
      - 'scripts/migrations/**'
      - 'tests/production-migration-gate.test.mjs'
      - 'tests/production-migration-actions-workflow.test.mjs'
      - 'tests/production-migration-organization-schema.test.mjs'
      - 'tests/production-migration-qa-inventory.test.mjs'
      - 'tests/production-migration-identity-*.test.mjs'
      - 'tests/helpers/identity-operator-preload.mjs'
      - 'functions/_lib/organization-name.js'
      - 'docs/runbooks/organization-identity-0043.md'
      - 'docs/runbooks/organization-qa-inventory.md'
      - 'tests/helpers/organization-schema-history.mjs'
      - '.github/workflows/production-d1-migration-operator.yml'
      - 'docs/runbooks/production-migrations-codex.md'
      - '.github/workflows/production-migration-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check migration operators
        run: |
          node --check scripts/migrations/production-migration-lib.mjs
          node --check scripts/migrations/audit-production.mjs
          node --check scripts/migrations/apply-production.mjs
          node --check scripts/migrations/post-validate-production.mjs
          node --check scripts/migrations/organization-management-schema.mjs
          node --check scripts/migrations/organization-schema-references.mjs
          node --check scripts/migrations/organization-qa-inventory.mjs
          node --check scripts/migrations/inventory-organizations-production.mjs
          node --check scripts/migrations/organization-identity-0043.mjs
          node --check scripts/migrations/preflight-organization-identity.mjs
      - name: Validate migration gates
        run: npm run test:production-migration-gate

  identity-wrangler-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact CLI for offline transport contract
        run: npm install --prefix "$RUNNER_TEMP/identity-wrangler" --no-save --no-audit --no-fund wrangler@4.140.0
      - name: Verify real Wrangler against synthetic loopback API only
        env:
          IDENTITY_WRANGLER_PACKAGE: ${{ runner.temp }}/identity-wrangler/node_modules/wrangler
          WRANGLER_SEND_METRICS: 'false'
        run: node --test tests/production-migration-identity-wrangler.test.mjs
