name: Save contract validation

on:
  pull_request:
    paths:
      - "functions/api/projects/**"
      - "functions/_lib/save-*.js"
      - "functions/_lib/project-save-*.js"
      - "functions/_lib/project-creation-reservation.js"
      - "functions/_lib/project-config-stream-validator.js"
      - "functions/_lib/map-config*.js"
      - "src/pages/Kepler/durable-save*.ts"
      - "src/pages/Kepler/save-edit-generation.ts"
      - "src/pages/Kepler/change-requests/durable-review-apply.ts"
      - "workers/project-save-operations.js"
      - "tests/project-save-*.test.mjs"
      - "tests/project-durable-*.test.mjs"
      - "tests/durable-save-*.test.mjs"
      - "tests/browser/durable-save*.spec.ts"
      - "playwright.durable-save.config.ts"
      - "functions/_lib/dropbox*.js"
      - "functions/_lib/project-config-revisions.js"
      - "functions/_lib/project-config-service.js"
      - "functions/_lib/organization-limit-service.js"
      - "functions/_lib/error-catalog.js"
      - "src/pages/Kepler/save-observability.ts"
      - "src/pages/Kepler/project-create-transport.ts"
      - "src/pages/Kepler/project-create-flow.ts"
      - "src/pages/Kepler/components/maono-save-button.tsx"
      - "src/pages/Kepler/components/project-create-panel.tsx"
      - "migrations/**"
      - "tests/save-*.test.mjs"
      - "tests/dropbox-*.test.mjs"
      - "tests/project-creation-metadata.test.mjs"
      - "tests/project-large-save.test.mjs"
      - "tests/project-large-legacy-lifecycle.test.mjs"
      - "tests/project-config-stream-watchdog.test.mjs"
      - "tests/project-config-revision-recycle.test.mjs"
      - "tests/project-config-revision-concurrency.test.mjs"
      - "tests/project-persistence-integration.test.mjs"
      - "tests/project-recycle-recovery.test.mjs"
      - "tests/helpers/project-persistence-fixture.mjs"
      - "tests/fixtures/maps/golden/**"
      - "scripts/project-revisions/**"
      - "package.json"
      - "schema.sql"
      - ".github/workflows/save-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Durable operation SQL, HTTP, storage and browser-controller gates
        run: npm run test:durable-save

      - name: Install browser engines for isolated recovery QA
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Real IndexedDB and mounted save-button recovery QA
        run: npm run test:durable-save-browser

      - name: Validate save observability and deploy contract
        run: npm run test:save-observability

      - name: Validate new-project frontend integration
        run: node --experimental-strip-types --test tests/project-creation-metadata.test.mjs

      - name: Validate Dropbox resilience contract
        run: npm run test:dropbox-resilience && node --test tests/dropbox-runtime-fetch.test.mjs

      - name: Validate large MapConfig streaming save
        run: node --experimental-strip-types --test tests/project-large-save.test.mjs tests/project-large-legacy-lifecycle.test.mjs

      - name: Validate large MapConfig stream watchdog
        run: node --test tests/project-config-stream-watchdog.test.mjs

      - name: Validate unpublished revision recycling
        run: node --test tests/project-config-revision-recycle.test.mjs tests/project-config-revision-concurrency.test.mjs

      - name: Validate persistence flows and manual recovery rehearsal
        run: npm run test:persistence-integration

      - name: Build application
        run: npm run build
