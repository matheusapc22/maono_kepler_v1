name: Project Pages Workspace
on:
  pull_request:
    branches: [mano_kepler_v1]
    paths:
      - 'src/pages/Projects.tsx'
      - 'src/pages/ProjectsSidebar.tsx'
      - 'src/pages/Projects/**'
      - 'src/access-control/**'
      - 'src/auth/session.tsx'
      - 'functions/_lib/project-list.js'
      - 'functions/api/projects/**'
      - 'tests/project-pages-contract.test.mjs'
      - 'tests/browser/project-pages.spec.ts'
      - 'playwright.project-pages.config.ts'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing repository dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Original source, pure filtering/paging and existing behavior contracts
        env:
          PROJECT_PAGES_REQUIRE_BASELINE: "1"
        run: >-
          node --test tests/project-pages-contract.test.mjs
          tests/project-card-redesign.test.mjs tests/project-card-actions.test.mjs
          tests/project-thumbnail-gate.test.mjs tests/project-preview-presentation.test.mjs
          tests/project-preview-lifecycle.test.mjs tests/project-metadata-api.test.mjs
          tests/project-route-semantics.test.mjs tests/projects-fallback-scope.test.mjs
          tests/documents-visual-contract.test.mjs
      - name: Build application
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Actual compiled React route with fixture APIs (not production acceptance)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: project-pages-results.json
        run: npx playwright test --config=playwright.project-pages.config.ts --reporter=list,json
      - name: Evidence and inspectable local build (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-pages-${{ github.sha }}
          path: |
            test-results/
            project-pages-results.json
            dist/
            tests/project-pages-contract.test.mjs
            tests/browser/project-pages.spec.ts
            playwright.project-pages.config.ts
            src/pages/Projects/components/ProjectPagesUi.tsx
            src/pages/Projects/components/ProjectPages.css
            src/pages/Projects/components/project-page-query.ts
          if-no-files-found: warn
          retention-days: 14
