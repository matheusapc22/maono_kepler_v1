name: Synthetic D1 metadata audit (read only)
on:
  pull_request:
    paths:
      - 'scripts/d1-remote-audit/**'
      - 'ops/d1-synthetic/manifest.json'
      - 'tests/d1-remote-audit-*.test.mjs'
      - '.github/workflows/d1-synthetic-readonly-audit.yml'
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: Exact reviewed manifest SHA-256; no resource selection inputs
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.manifest.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/d1-remote-audit-*.test.mjs
      - id: manifest
        shell: bash
        run: |
          node scripts/d1-remote-audit/cli.mjs --validate
          node --input-type=module -e "import{readFileSync,appendFileSync}from'node:fs';const m=JSON.parse(readFileSync('ops/d1-synthetic/manifest.json','utf8'));appendFileSync(process.env.GITHUB_OUTPUT,'enabled='+String(m.readOnlyAuditEnabled===true)+'\\n');"
  protection:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.outputs.enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing environment protection before scheduling secret-bearing job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/environments/synthetic-d1-readonly-audit" > environment.json
          node -e "const e=require('./environment.json');if(e.can_admins_bypass!==false||!e.protection_rules?.some(r=>r.type==='required_reviewers'&&r.prevent_self_review===true&&r.reviewers?.length>0))process.exit(1);"
  audit:
    needs: [validate, protection]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.outputs.enabled == 'true'
    environment: synthetic-d1-readonly-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read only the pinned synthetic resource metadata
        env:
          MAONO_SYNTHETIC_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          MAONO_ENABLE_SYNTHETIC_READONLY_AUDIT: '1'
          MAONO_SYNTHETIC_AUDIT_READ_TOKEN: ${{ secrets.MAONO_SYNTHETIC_AUDIT_READ_TOKEN }}
        run: node scripts/d1-remote-audit/cli.mjs --audit
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-readonly-audit-summary
          path: .tmp/d1-remote-audit-summary.json
          if-no-files-found: error
          retention-days: 7
