name: Production Acceptance Operator

on:
  pull_request:
    paths:
      - '.github/workflows/production-acceptance-operator.yml'
      - '.github/scripts/acceptance-browser/**'
      - 'scripts/acceptance/**'
      - 'tests/production-acceptance-operator*.test.mjs'
      - 'tests/test_organization_artifact_provenance.py'
      - 'docs/runbooks/production-acceptance-operator.md'
      - 'AGENTS.md'
      - 'package.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight | run | closure"
        required: true
        type: choice
        options:
          - preflight
          - run
          - closure
      suite:
        description: "Registered suite id, e.g. cc04-selective-access"
        required: true
        type: string
      organization_id:
        description: "Dedicated QA organization id (B1 sandbox only: sandbox)"
        required: true
        type: string
      qa_user_ids:
        description: "CC03/CC04 run: approved IDs in order manager,allowed,restricted (no credentials)"
        required: false
        default: ""
        type: string
      cc03_window:
        description: "CC03 run only: reviewed sanitized global-window JSON (never credentials); see runbook"
        required: false
        default: ""
        type: string
      cc07_plan:
        description: "CC07 only: reviewed scoped window/Worker version/limit JSON; never credentials"
        required: false
        default: ""
        type: string
      project_slug:
        description: "Optional project slug for suites that need one"
        required: false
        default: ""
        type: string
      b1_baseline:
        description: "B1 sandbox only: SHA-256 from the preflight on this commit"
        required: false
        type: string
      confirmation:
        description: "preflight=PREPARE_PRODUCTION_ACCEPTANCE | run=RUN_PRODUCTION_ACCEPTANCE | closure=RESTORE_PRODUCTION_ACCEPTANCE_SAFE_STATE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maono-production-acceptance${{ (inputs.suite == 'organization-b1-cloudflare-test' || inputs.suite == 'organization-b1-evidence-test') && '-b1-sandbox' || '' }}
  cancel-in-progress: false

env:
  PRODUCT_BRANCH: mano_kepler_v1

jobs:
  b1-validate:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'organization-b1-cloudflare-test'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bind explicit sandbox request to owner, branch and SHA
        env:
          MODE: ${{ inputs.mode }}
          BASELINE: ${{ inputs.b1_baseline }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SCOPE: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "matheusapc22/maono_kepler_v1"
          test "$GITHUB_ACTOR" = "matheusapc22"
          test "$GITHUB_REF" = "refs/heads/au-ac01-b1-capacidade"
          test "$GITHUB_TRIGGERING_ACTOR" = "matheusapc22"
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then test "$MODE" != preflight; fi
          test "$SCOPE" = sandbox
          test "$CONFIRMATION" = "B1-$MODE-$GITHUB_SHA"
          case "$MODE" in
            preflight) test -z "$BASELINE" ;;
            run|closure) [[ "$BASELINE" =~ ^[a-f0-9]{64}$ ]] ;;
            *) exit 2 ;;
          esac

  b1-cloudflare:
    needs: b1-validate
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: maono-b1-ensaios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify reviewed PR is still open at the dispatched commit
        if: github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/306" --jq 'select(.state == "open" and .head.ref == "au-ac01-b1-capacidade" and .head.repo.full_name == "matheusapc22/maono_kepler_v1") | .head.sha')"
          test "$actual" = "$GITHUB_SHA"
      - name: Bind recovery to the original interrupted attempt
        if: github.run_attempt != 1
        env:
          GH_TOKEN: ${{ github.token }}
          B1_ORIGINAL_MODE: ${{ inputs.mode }}
        run: python3 scripts/acceptance/b1-recovery-guard.py
      - name: Observe or restore the three B1 sandbox fixtures
        env:
          B1_CF_TOKEN: ${{ secrets.MAONO_B1_CF_TOKEN }}
          B1_MODE: ${{ github.run_attempt != 1 && 'closure' || inputs.mode }}
          B1_BASELINE: ${{ inputs.b1_baseline }}
          B1_REPORT: ${{ runner.temp }}/b1-cloudflare.json
        run: node scripts/acceptance/organization-cloudflare-sandbox.mjs
      - name: Preserve sanitized observations even on partial failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b1-cloudflare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b1-cloudflare.json
          if-no-files-found: error
          retention-days: 7

  b1-evidence-pin:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'organization-b1-evidence-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      product: ${{ steps.pin.outputs.product }}
    steps:
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          SCOPE: ${{ inputs.organization_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = matheusapc22/maono_kepler_v1
          test "$GITHUB_ACTOR" = matheusapc22
          test "$GITHUB_TRIGGERING_ACTOR" = matheusapc22
          test "$GITHUB_REF" = refs/heads/au-ac01-b1-capacidade
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$MODE" = preflight
          test "$SCOPE" = sandbox
          test "$CONFIRMATION" = "B1-evidence-$GITHUB_SHA"
          reviewed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/306" --jq 'select(.state == "open" and .head.ref == "au-ac01-b1-capacidade" and .head.repo.full_name == "matheusapc22/maono_kepler_v1") | .head.sha')
          test "$reviewed" = "$GITHUB_SHA"
          product=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/mano_kepler_v1" --jq '.object.sha')
          [[ "$product" =~ ^[a-f0-9]{40}$ ]]
          echo "product=$product" >> "$GITHUB_OUTPUT"

  b1-evidence-producer:
    needs: b1-evidence-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: maono-b1-ensaios
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update: ${{ steps.update.outputs.artifact-id }}
      pause: ${{ steps.pause.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout product independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.b1-evidence-pin.outputs.product }}
          path: observed-product
          persist-credentials: false
      - name: Produce the two permitted synthetic observations
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.b1-evidence-pin.outputs.product }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C observed-product rev-parse HEAD)" = "$PRODUCT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/306" --jq 'select(.state == "open") | .head.sha')" = "$GITHUB_SHA"
          for kind in update pause; do
            mkdir -m 700 "$RUNNER_TEMP/$kind"
            python3 scripts/acceptance/produce-organization-artifact.py --directory "$RUNNER_TEMP/$kind" \
              --case "synthetic-organization-$kind" --workflow-sha "$GITHUB_SHA" --sha "$PRODUCT" --run "$GITHUB_RUN_ID"
          done
      - id: update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b1-test-case-${{ github.run_id }}-1-synthetic-organization-update
          path: ${{ runner.temp }}/update/organization-evidence.json
          if-no-files-found: error
          retention-days: 7
      - id: pause
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b1-test-case-${{ github.run_id }}-1-synthetic-organization-pause
          path: ${{ runner.temp }}/pause/organization-evidence.json
          if-no-files-found: error
          retention-days: 7

  b1-evidence-consumer:
    needs: [b1-evidence-pin, b1-evidence-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify original archives and exercise case windows
        env:
          GH_TOKEN: ${{ github.token }}
          MAONO_EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
          B1_PRODUCT: ${{ needs.b1-evidence-pin.outputs.product }}
          B1_UPDATE_ID: ${{ needs.b1-evidence-producer.outputs.update }}
          B1_PAUSE_ID: ${{ needs.b1-evidence-producer.outputs.pause }}
        run: bash scripts/acceptance/consume-organization-test-cases.sh
      - name: Preserve receipts separately from original archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: b1-test-case-receipts-${{ github.run_id }}-1
          path: ${{ runner.temp }}/b1-case-receipts/*.json
          if-no-files-found: error
          retention-days: 7

  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax-check generic acceptance framework
        run: |
          node --check scripts/acceptance/production-acceptance-lib.mjs
          node --check scripts/acceptance/registry.mjs
          node --check scripts/acceptance/operator.mjs
          node --check scripts/acceptance/suites/cc04-selective-access.mjs
          bash -n .github/scripts/acceptance-browser/setup.sh
          node --check .github/scripts/acceptance-browser/smoke.mjs
      - name: Validate acceptance operator contracts
        run: node --test tests/production-acceptance-operator*.test.mjs
      - name: Verify organization artifact transport using offline fixtures
        run: python3 -m unittest discover -s tests -p test_organization_artifact_provenance.py

      - name: Produce sanitized synthetic artifact
        id: synthetic-evidence
        if: github.run_attempt == 1
        run: |
          evidence_dir="$(mktemp -d)"
          evidence_file="$(python3 scripts/acceptance/produce-organization-artifact.py \
            --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --directory "$evidence_dir")"
          echo "path=$evidence_file" >> "$GITHUB_OUTPUT"
      - name: Upload synthetic fixture
        if: github.run_attempt == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-organization-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.synthetic-evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  browser-setup-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prove isolated browser setup without Production credentials
        timeout-minutes: 5
        shell: bash
        run: |
          bash .github/scripts/acceptance-browser/setup.sh
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=no)"

  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'organization-b1-cloudflare-test' && inputs.suite != 'organization-b1-evidence-test'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      release_sha: ${{ steps.pin.outputs.sha }}
      browser_required: ${{ steps.suite.outputs.browser_required }}
    steps:
      - name: Validate owner, default ref and explicit confirmation
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_REF: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ORG_ID: ${{ inputs.organization_id }}
          SUITE: ${{ inputs.suite }}
          QA_USER_IDS: ${{ inputs.qa_user_ids }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"
          test "$DISPATCH_REF" = "main"
          [[ "$ORG_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$MODE" = "run" && ( "$SUITE" = "cc04-selective-access" || "$SUITE" = "cc03-command-lifecycle" || "$SUITE" = "cc03-recover-ticket-5" ) ]]; then
            [[ "$QA_USER_IDS" =~ ^[1-9][0-9]*,[1-9][0-9]*,[1-9][0-9]*$ ]]
          fi
          case "$MODE" in
            preflight) test "$CONFIRMATION" = "PREPARE_PRODUCTION_ACCEPTANCE" ;;
            run) test "$CONFIRMATION" = "RUN_PRODUCTION_ACCEPTANCE" ;;
            closure) test "$CONFIRMATION" = "RESTORE_PRODUCTION_ACCEPTANCE_SAFE_STATE" ;;
            *) exit 2 ;;
          esac

      - name: Checkout canonical product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Pin audited product SHA
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned product SHA: $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate suite registration and contracts without production secrets
        id: suite
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          node --check scripts/acceptance/production-acceptance-lib.mjs
          node --check scripts/acceptance/registry.mjs
          node --check scripts/acceptance/operator.mjs
          bash -n .github/scripts/acceptance-browser/setup.sh
          node --check .github/scripts/acceptance-browser/smoke.mjs
          description="$(node scripts/acceptance/operator.mjs --mode describe --suite "$SUITE")"
          browser_required="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(String(d.requiresBrowser===true));' <<<"$description")"
          echo "browser_required=$browser_required" >> "$GITHUB_OUTPUT"
          node --test tests/production-acceptance-operator*.test.mjs

  protected:
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'organization-b1-cloudflare-test' && inputs.suite != 'organization-b1-evidence-test'
    needs: validate
    runs-on: ubuntu-24.04
    # Bounded steps: setup11 + operator192 + summary/artifacts3 =206 minutes.
    # Four more minutes remain below the job limit for Actions overhead.
    timeout-minutes: 210
    environment: production-acceptance
    env:
      MODE: ${{ inputs.mode }}
      SUITE: ${{ inputs.suite }}
      ORG_ID: ${{ inputs.organization_id }}
      PROJECT_SLUG: ${{ inputs.project_slug }}
      QA_USER_IDS: ${{ inputs.qa_user_ids }}
      MAONO_ACCEPTANCE_CC03_WINDOW_JSON: ${{ inputs.cc03_window }}
      MAONO_ACCEPTANCE_CC07_PLAN_JSON: ${{ inputs.cc07_plan }}
      VALIDATED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
    steps:
      - name: Checkout exactly the validated product SHA
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0

      - name: Refuse product-branch drift before protected access
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$VALIDATED_RELEASE_SHA"

      - timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install isolated browser runtime before any Production secret is exposed
        timeout-minutes: 5
        if: needs.validate.outputs.browser_required == 'true' && inputs.mode == 'run'
        shell: bash
        run: |
          bash .github/scripts/acceptance-browser/setup.sh
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Execute protected Production acceptance operation
        # Internal 190-minute budget leaves two minutes before this step limit.
        timeout-minutes: 192
        shell: bash
        env:
          MAONO_ACCEPTANCE_CLOUDFLARE_API_TOKEN: ${{ secrets.MAONO_ACCEPTANCE_CLOUDFLARE_API_TOKEN }}
          MAONO_ACCEPTANCE_QA_CREDENTIALS_JSON: ${{ inputs.mode == 'run' && inputs.suite != 'cc07-notifications' && secrets.MAONO_ACCEPTANCE_QA_CREDENTIALS_JSON || '' }}
          MAONO_ACCEPTANCE_CC07_WORKER_TOKEN: ${{ inputs.suite == 'cc07-notifications' && secrets.MAONO_ACCEPTANCE_CC07_WORKER_TOKEN || '' }}
          MAONO_ACCEPTANCE_CC07_D1_READ_TOKEN: ${{ inputs.suite == 'cc07-notifications' && secrets.MAONO_ACCEPTANCE_CC07_D1_READ_TOKEN || '' }}
          MAONO_ACCEPTANCE_CC07_QA_CREDENTIALS_JSON: ${{ inputs.suite == 'cc07-notifications' && inputs.mode == 'run' && secrets.MAONO_ACCEPTANCE_CC07_QA_CREDENTIALS_JSON || '' }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/production-acceptance
          args=(
            --mode "$MODE"
            --suite "$SUITE"
            --organization-id "$ORG_ID"
            --expected-commit "$VALIDATED_RELEASE_SHA"
            --report ".tmp/production-acceptance/report.json"
          )
          if [[ -n "$PROJECT_SLUG" ]]; then
            args+=(--project-slug "$PROJECT_SLUG")
          fi
          if [[ -n "$QA_USER_IDS" ]]; then
            args+=(--qa-user-ids "$QA_USER_IDS")
          fi
          node scripts/acceptance/operator.mjs "${args[@]}"

      - name: Summarize sanitized acceptance result
        timeout-minutes: 1
        if: always()
        shell: bash
        run: |
          if [[ ! -f .tmp/production-acceptance/report.json ]]; then
            echo "No acceptance report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const r = JSON.parse(fs.readFileSync(".tmp/production-acceptance/report.json", "utf8"));
          const lines = [
            "### Production Acceptance Operator",
            "",
            `- suite: \`${r.suite}\``,
            `- mode: \`${r.mode}\``,
            `- product SHA: \`${r.expectedCommit}\``,
            `- acceptance executed: \`${r.acceptanceExecuted}\``,
            `- configuration restored: \`${r.configurationRestored}\``,
            `- cleanup complete: \`${r.cleanupComplete}\``,
            `- result: **${r.ok && r.complete ? "PASS" : "FAIL"}**`,
          ];
          for (const c of r.cases || []) lines.push(`- ${c.id}: **${c.status}**`);
          if (r.error) lines.push(`- error: \`${r.error.code}\` — ${r.error.message}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

      - name: Retain sanitized acceptance evidence
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-acceptance-${{ inputs.mode }}-${{ inputs.suite }}-${{ github.run_id }}
          path: .tmp/production-acceptance/report*.json
          if-no-files-found: ignore
          retention-days: 14
