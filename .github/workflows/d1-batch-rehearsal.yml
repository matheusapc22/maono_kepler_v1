name: D1 batch rehearsal (local only)
on:
  pull_request:
    paths:
      - 'scripts/d1-batch-rehearsal/**'
      - 'scripts/migrations/**'
      - 'tests/fixtures/deletion-historical-safety/**'
      - 'tests/helpers/deletion-historical-fixture.mjs'
      - 'schema.sql'
      - 'migrations/**'
      - 'AGENTS.md'
      - 'tests/d1-batch-rehearsal.test.mjs'
      - '.github/workflows/d1-batch-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-batch-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned local emulator (no application install)
        run: npm install --prefix .tmp/d1-batch-rehearsal-runtime --no-save --package-lock=false wrangler@4.140.0
      - name: Test fixed Worker boundary
        run: node --test tests/d1-batch-rehearsal.test.mjs tests/production-migration-historical-operator.test.mjs
      - name: Run full synthetic historical matrix through local Worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/d1-batch-rehearsal/run-local.mjs
      - name: Publish sanitized local evidence only
        uses: actions/upload-artifact@v4
        with:
          name: d1-batch-local-evidence
          path: .tmp/d1-batch-rehearsal-results.json
          if-no-files-found: error
          retention-days: 7
