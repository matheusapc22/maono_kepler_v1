name: Organization storage recovery operator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate | deploy_disabled | deploy_dry_run | deploy_apply"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - deploy_disabled
          - deploy_dry_run
          - deploy_apply
      confirmation:
        description: "Confirmação exata correspondente ao modo"
        required: true
        type: string
      migration_0009_confirmation:
        description: "Para dry-run/apply: digite MIGRATION_0009_APPLIED_TO_TARGET_D1"
        required: false
        type: string
      release_ref:
        description: "Branch/ref já validada"
        required: true
        default: "mano_kepler_v1"
        type: string
      batch_size:
        description: "Organizações por execução (1–50; começar com 1)"
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: organization-storage-recovery-operator
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate explicit operator confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_0009_confirmation }}
          RELEASE_REF: ${{ inputs.release_ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$MODE" in
            validate)
              expected="VALIDATE_STORAGE_RECOVERY_OPERATOR"
              ;;
            deploy_disabled)
              expected="DEPLOY_STORAGE_RECOVERY_DISABLED"
              ;;
            deploy_dry_run)
              expected="DEPLOY_STORAGE_RECOVERY_DRY_RUN"
              ;;
            deploy_apply)
              expected="DEPLOY_STORAGE_RECOVERY_APPLY"
              ;;
            *)
              echo "Modo inválido." >&2
              exit 2
              ;;
          esac

          test "$CONFIRMATION" = "$expected"

          if [[ "$MODE" == "deploy_dry_run" || "$MODE" == "deploy_apply" ]]; then
            test "$MIGRATION_CONFIRMATION" = "MIGRATION_0009_APPLIED_TO_TARGET_D1"
          fi

          # Deployment accepts only the product branch or an immutable release SHA.
          if [[ "$MODE" != "validate" ]]; then
            [[ "$RELEASE_REF" == "mano_kepler_v1" || "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          fi

  validate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout requested release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Pin audited release SHA
        id: pin
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$MODE" != "validate" ]]; then
            git merge-base --is-ancestor "$sha" origin/mano_kepler_v1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated release SHA: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate drift/recovery contracts
        run: |
          npm run test:organization-drift
          npm run test:organization-readiness
          npm run test:organization-storage
          npm run test:organization-lifecycle

      - name: Syntax-check operator helpers
        run: |
          node --check scripts/organization-storage/render-recovery-wrangler-config.mjs
          node --check workers/organization-storage-recovery.js

      - name: Bundle every operator mode without deployment
        env:
          MAONO_RECOVERY_D1_DATABASE_ID: 5bc4dc32-f3bd-4c92-bbd1-cbda63e467db
          MAONO_STORAGE_RECOVERY_BATCH_SIZE: ${{ inputs.batch_size }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -euo pipefail
          for mode in disabled dry-run apply; do
            MAONO_RECOVERY_OPERATOR_MODE="$mode" MAONO_RECOVERY_CONFIG_PATH=".tmp/recovery-$mode.toml" node scripts/organization-storage/render-recovery-wrangler-config.mjs
            npx --yes wrangler@4.112.0 deploy --dry-run --config ".tmp/recovery-$mode.toml" --outdir ".tmp/recovery-bundle-$mode"
          done

      - name: Build application
        run: npm run build

  deploy:
    if: ${{ inputs.mode != 'validate' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MODE: ${{ inputs.mode }}
      VALIDATED_RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      RELEASE_REF: ${{ inputs.release_ref }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAONO_RECOVERY_D1_DATABASE_ID: ${{ secrets.MAONO_PRODUCTION_D1_DATABASE_ID }}
      MAONO_STORAGE_RECOVERY_BATCH_SIZE: ${{ inputs.batch_size }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    steps:
      - name: Checkout validated release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Refuse release ref drift
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/${RELEASE_REF}" | awk '{print $1}')"
          if [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            current="$RELEASE_REF"
          fi
          test -n "$current"
          test "$current" = "$VALIDATED_RELEASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "09d455fa1cf988b0d9db89987b73eaff"
          test "$MAONO_RECOVERY_D1_DATABASE_ID" = "5bc4dc32-f3bd-4c92-bbd1-cbda63e467db"

          if [[ "$MODE" == "deploy_apply" ]]; then
            test -n "$DROPBOX_APP_KEY"
            test -n "$DROPBOX_APP_SECRET"
            test -n "$DROPBOX_REFRESH_TOKEN"
          fi

      - name: Render safe disabled config
        env:
          MAONO_RECOVERY_OPERATOR_MODE: disabled
          MAONO_RECOVERY_CONFIG_PATH: .tmp/recovery-worker.toml
        run: node scripts/organization-storage/render-recovery-wrangler-config.mjs

      - name: Verify live D1 identity and migration prerequisite without writes
        if: ${{ inputs.mode == 'deploy_dry_run' || inputs.mode == 'deploy_apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.112.0 d1 info maono_maps --config .tmp/recovery-worker.toml --json > .tmp/recovery-d1-info.json
          npx --yes wrangler@4.112.0 d1 execute maono_maps --remote --config .tmp/recovery-worker.toml --json --command "SELECT name, applied_at FROM d1_migrations WHERE name = '0009_organization_storage_invariant.sql'; PRAGMA table_info(organizations); PRAGMA index_list(organizations); PRAGMA index_info(idx_organizations_storage_status);" > .tmp/recovery-d1-prerequisite.json
          npx --yes wrangler@4.112.0 d1 time-travel info maono_maps --config .tmp/recovery-worker.toml --json > .tmp/recovery-d1-bookmark.json
          node scripts/organization-storage/verify-recovery-d1-evidence.mjs .tmp/recovery-d1-info.json .tmp/recovery-d1-prerequisite.json .tmp/recovery-d1-bookmark.json

      - name: Retain read-only D1 prerequisite evidence
        if: ${{ always() && (inputs.mode == 'deploy_dry_run' || inputs.mode == 'deploy_apply') }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-d1-prerequisite-${{ github.run_id }}
          path: .tmp/recovery-d1-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy disabled baseline first
        id: baseline
        run: npx --yes wrangler@4.112.0 deploy --config .tmp/recovery-worker.toml

      - name: Configure Dropbox secrets before apply
        if: ${{ inputs.mode == 'deploy_apply' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DROPBOX_APP_KEY" | npx --yes wrangler@4.112.0 secret put DROPBOX_APP_KEY --config .tmp/recovery-worker.toml
          printf '%s' "$DROPBOX_APP_SECRET" | npx --yes wrangler@4.112.0 secret put DROPBOX_APP_SECRET --config .tmp/recovery-worker.toml
          printf '%s' "$DROPBOX_REFRESH_TOKEN" | npx --yes wrangler@4.112.0 secret put DROPBOX_REFRESH_TOKEN --config .tmp/recovery-worker.toml

      - name: Render requested final config
        if: ${{ inputs.mode != 'deploy_disabled' }}
        env:
          MAONO_RECOVERY_CONFIG_PATH: .tmp/recovery-worker.toml
          MAONO_RECOVERY_OPERATOR_MODE: ${{ inputs.mode == 'deploy_apply' && 'apply' || 'dry-run' }}
        run: node scripts/organization-storage/render-recovery-wrangler-config.mjs

      - name: Deploy requested final mode
        if: ${{ inputs.mode != 'deploy_disabled' }}
        run: npx --yes wrangler@4.112.0 deploy --config .tmp/recovery-worker.toml

      - name: Record operator result
        shell: bash
        run: |
          {
            echo "### Organization storage recovery operator"
            printf -- '- release SHA: `%s`\n' "$VALIDATED_RELEASE_SHA"
            printf -- '- mode: `%s`\n' "$MODE"
            printf -- '- worker: `%s`\n' 'maono-organization-storage-recovery'
            if [[ "$MODE" == "deploy_disabled" ]]; then
              echo "- runtime state: disabled"
            elif [[ "$MODE" == "deploy_dry_run" ]]; then
              echo "- runtime state: enabled + dry-run"
            else
              echo "- runtime state: enabled + apply"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore disabled mode after incomplete activation
        if: ${{ failure() && steps.baseline.outcome == 'success' }}
        env:
          MAONO_RECOVERY_CONFIG_PATH: .tmp/recovery-worker.toml
          MAONO_RECOVERY_OPERATOR_MODE: disabled
        shell: bash
        run: |
          set -euo pipefail
          node scripts/organization-storage/render-recovery-wrangler-config.mjs
          npx --yes wrangler@4.112.0 deploy --config .tmp/recovery-worker.toml
          printf '%s\n' 'Activation failed; disabled mode restored. Investigate before another activation.' >> "$GITHUB_STEP_SUMMARY"
