name: Large CREATE Preview acceptance (retired)

# The old Preview cookie-based runner could share production bindings and had
# no protected cleanup contract. Keep this visible, fail-closed entrypoint so
# operators cannot mistake a Preview URL for authorization to mutate it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the protected registered acceptance flow
        run: |
          echo '::error::Retired. Use durable-project-save in production-acceptance-operator.yml after binding audit, separate Worker deployment approval and the protected human-approved acceptance window.'
          exit 1
