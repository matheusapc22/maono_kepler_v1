name: Change Request D1 rollout preflight

on:
  workflow_dispatch:
  push:
    branches: [feat/change-requests-ticket-lifecycle]
    paths:
      - .github/workflows/change-request-d1-preflight.yml
      - scripts/operations/change-request-d1-preflight.mjs

permissions:
  contents: read

concurrency:
  group: change-request-d1-rollout
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'matheusapc22/maono_kepler_v1' && github.ref == 'refs/heads/feat/change-requests-ticket-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify D1 target and migration ledger (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/operations/change-request-d1-preflight.mjs
