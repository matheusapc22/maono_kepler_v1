name: Central de Chamados contracts

on:
  pull_request:
    paths:
      - 'src/pages/Projects/components/useTicketDialog.ts'
      - 'src/pages/Projects/components/ticket-accessibility.css'
      - 'tests/browser/ticket-accessibility.spec.ts'
      - 'tests/browser/fixtures/ticket-accessibility*'
      - 'functions/_lib/ticket-feedback*.js'
      - 'functions/api/organizations/*/ticket-feedback*'
      - 'functions/api/organizations/*/ticket-feedback/**'
      - 'migrations/0038_ticket_feedback.sql'
      - 'tests/ticket-feedback*.test.mjs'
      - 'src/pages/Projects/components/TicketFeedbackPanel.tsx'
      - 'tests/browser/ticket-feedback.spec.ts'
      - 'tests/browser/fixtures/ticket-feedback*'
      - 'docs/central-chamados/**'
      - 'scripts/central-chamados/**'
      - 'functions/_lib/ticket-notification*.js'
      - 'workers/ticket-notifications.js'
      - 'wrangler.ticket-notifications.toml.example'
      - 'migrations/0030_ticket_notifications.sql'
      - 'migrations/0034_ticket_metric_rollups.sql'
      - 'migrations/0035_ticket_report_exports.sql'
      - 'migrations/0036_ticket_incidents_problems.sql'
      - 'functions/_lib/ticket-case*.js'
      - 'functions/api/organizations/*/ticket-cases*'
      - 'functions/api/organizations/*/ticket-cases/**'
      - 'tests/ticket-cases*.test.mjs'
      - 'functions/api/organizations/*/ticket-knowledge*'
      - 'functions/api/organizations/*/ticket-knowledge/**'
      - 'tests/ticket-knowledge*.test.mjs'
      - 'tests/browser/ticket-knowledge.spec.ts'
      - 'tests/browser/fixtures/ticket-knowledge*'
      - 'src/pages/Projects/components/TicketKnowledgePanel.tsx'
      - 'src/pages/Projects/components/ticket-knowledge.css'
      - 'tests/browser/ticket-cases.spec.ts'
      - 'tests/browser/fixtures/ticket-cases*'
      - 'src/pages/Projects/components/ticket-cases.css'
      - 'scripts/migrations/cc13-schema-preflight.mjs'
      - 'functions/_lib/ticket-export*.js'
      - 'functions/api/organizations/*/tickets/exports*'
      - 'functions/api/organizations/*/tickets/exports/**'
      - 'workers/ticket-exports.js'
      - 'wrangler.ticket-exports.toml.example'
      - 'tests/ticket-exports*.test.mjs'
      - 'tests/browser/ticket-exports.spec.ts'
      - 'tests/browser/fixtures/ticket-exports*'
      - 'src/pages/Projects/components/ticket-exports.css'
      - 'scripts/migrations/cc12-schema-preflight.mjs'
      - 'functions/_lib/ticket-metrics*.js'
      - 'tests/ticket-metrics*.test.mjs'
      - 'src/pages/Projects/components/ticket-metrics.css'
      - 'scripts/migrations/cc11-schema-preflight.mjs'
      - 'functions/api/organizations/*/tickets/metrics.js'
      - 'tests/ticket-notifications*.test.mjs'
      - 'tests/browser/ticket-notifications.spec.ts'
      - 'tests/browser/fixtures/ticket-notifications*'
      - 'src/pages/Projects/components/ticket-notifications.css'
      - 'functions/api/organizations/*/ticket-notifications*'
      - 'functions/api/organizations/*/ticket-notifications/**'
      - 'functions/_lib/ticket-center.js'
      - 'functions/_lib/ticket-triage.js'
      - 'functions/_lib/ticket-commands.js'
      - 'functions/_lib/ticket-command-http.js'
      - 'functions/_lib/ticket-access.js'
      - 'functions/_lib/ticket-legacy-backfill.js'
      - 'functions/_lib/project-change-requests.js'
      - 'functions/_lib/project-change-request-review.js'
      - 'functions/_lib/project-change-request-inbox.js'
      - 'functions/_lib/project-change-request-analysis-submission.js'
      - 'functions/_lib/permissions.js'
      - 'functions/api/admin/users/*.js'
      - 'src/access-control/permissions.ts'
      - 'src/pages/Projects/components/ticket-types.ts'
      - 'src/pages/Projects/components/tickets-api.ts'
      - 'src/pages/Projects/components/*Ticket*.tsx'
      - 'src/pages/Projects/components/ticket-triage-form.ts'
      - 'src/pages/Projects/components/ticket-triage.css'
      - 'src/pages/Projects/components/ticket-command-form.ts'
      - 'src/pages/Projects/components/ticket-lifecycle.css'
      - 'tests/ticket-triage*.test.mjs'
      - 'tests/helpers/ticket-triage*.mjs'
      - 'tests/ticket-command*.test.mjs'
      - 'tests/ticket-access*.test.mjs'
      - 'tests/ticket-legacy-backfill.test.mjs'
      - 'tests/ticket-backfill*.test.mjs'
      - 'tests/ticket-production-preflight.test.mjs'
      - 'tests/helpers/ticket-command*.mjs'
      - 'migrations/0010_ticket_center.sql'
      - 'migrations/0020_project_change_requests.sql'
      - 'migrations/0025_ticket_triage_classification.sql'
      - 'migrations/0026_ticket_command_lifecycle.sql'
      - 'migrations/0027_ticket_selective_access.sql'
      - 'schema.sql'
      - 'functions/_lib/ticket-sla*.js'
      - 'tests/ticket-sla*.test.mjs'
      - 'src/pages/Projects/components/ticket-sla.css'
      - 'migrations/0033_ticket_sla_policies.sql'
      - 'scripts/migrations/cc10-schema-preflight.mjs'
      - 'functions/_lib/ticket-flow.js'
      - 'src/pages/Projects.tsx'
      - 'src/pages/Projects/components/ticket-flow.css'
      - 'scripts/migrations/cc09-schema-preflight.mjs'
      - 'src/pages/Projects/components/ticket-navigation.ts'
      - 'migrations/0032_ticket_flow_navigation.sql'
      - 'tests/ticket-flow*.test.mjs'
      - 'functions/api/organizations/*/ticket-access/**'
      - 'functions/api/organizations/*/ticket-access/*.js'
      - 'functions/api/organizations/*/tickets/**'
      - 'functions/api/organizations/*/tickets.js'
      - 'functions/api/projects/*/change-requests/**'
      - 'functions/api/projects/*/change-requests.js'
      - '.github/workflows/central-chamados-contracts.yml'
      - 'tests/ticket-integrated-gate.test.mjs'
      - 'tests/helpers/ticket-integrated-db.mjs'
      - 'tests/helpers/ticket-upload-provider.mjs'
      - 'tests/cc17-evidence.test.mjs'
      - 'tests/cc18-*.test.mjs'
      - 'tests/production-acceptance-operator*.test.mjs'
      - 'scripts/acceptance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cc18-operational-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated pinned OpenAPI validator
        run: npm ci --prefix scripts/central-chamados/cc18 --no-audit --no-fund
      - name: Validate delivery evidence gate and documentation contracts
        run: |
          npm run test:cc18
          npm run validate:cc18

  cc01-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published source contracts
        run: node scripts/central-chamados/validate-cc01.mjs
      - name: Run existing ticket regression tests
        run: node --test tests/ticket-center.test.mjs
      - name: Verify Preview safety policy
        run: npm run test:preview-safety

  cc02-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate triage contracts, SQLite migration and legacy compatibility
        run: node --experimental-strip-types --test tests/ticket-triage*.test.mjs
      - name: Verify product error presentation ratchet
        run: node scripts/audit-user-error-sinks.mjs --baseline scripts/user-error-sink-baseline.json --strict-baseline

  cc03-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate commands, concurrency, lifecycle and controlled backfill
        run: node --experimental-strip-types --test tests/ticket-command*.test.mjs tests/ticket-legacy-backfill.test.mjs tests/ticket-backfill*.test.mjs tests/ticket-production-preflight.test.mjs

  cc04-selective-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate private-ticket authorization, ACL precedence and schema isolation
        run: node --experimental-strip-types --test tests/ticket-access*.test.mjs

  cc03-d1-binding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the isolated pinned operator runtime
        run: npm ci --prefix scripts/central-chamados/operator --no-audit --no-fund
      - name: Verify native D1 binding locally without remote access
        run: |
          node scripts/central-chamados/operator/smoke-local.mjs
          node scripts/central-chamados/operator/smoke-cases-local.mjs

  cc07-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate durable delivery, migration and authorization
        run: node --test tests/ticket-notifications*.test.mjs

  cc08-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CR reconciliation, authorization, lineage and 90MiB stream
        run: node --experimental-strip-types --test tests/ticket-changes.test.mjs tests/project-change-request*.test.mjs tests/project-large-save.test.mjs

  cc09-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate stable navigation and atomic WIP
        run: node --experimental-strip-types --test tests/ticket-flow*.test.mjs

  cc10-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate versioned SLA calendars, replay, ACL and additive migration
        run: node --test tests/ticket-sla*.test.mjs

  cc11-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate metric populations, deterministic replay, ACL and migration
        run: node --test tests/ticket-metrics*.test.mjs

  cc12-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete exports, generation fences, ACL, retries and migration
        run: node --test tests/ticket-exports*.test.mjs

  cc13-incidents-problems:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate cases, independent ACL, concurrency, communications and CC12-C
        run: node --test tests/ticket-cases*.test.mjs tests/ticket-exports*.test.mjs

  cc14-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate editorial review, private origins, reuse and atomic provenance
        run: node --test tests/ticket-knowledge*.test.mjs tests/ticket-conversation*.test.mjs

  cc15-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate voluntary feedback, cycle uniqueness, delivery ACL and mature cohorts
        run: node --test tests/ticket-feedback*.test.mjs tests/ticket-metrics*.test.mjs tests/ticket-notifications*.test.mjs

  cc16-experience-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate keyboard, drafts, conflicts and exact send replay
        run: npx playwright test tests/browser/ticket-accessibility.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cc16-browser-failures
          path: test-results/
          retention-days: 7

  cc17-integrated-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate integrated authorization, faults and evidence gate
        run: npm run test:cc17
      - name: Measure local mixed workload (not Production acceptance)
        run: npm run benchmark:cc17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc17-local-baseline
          path: .tmp/cc17/benchmark.json
          retention-days: 30
