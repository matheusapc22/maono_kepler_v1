<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/Simbolo_Maono.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/Simbolo_Maono.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/Simbolo_Maono.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,noimageindex,nosnippet"
    />
    <meta name="theme-color" content="#060606" />
    <title>Maõno Tecnologia | Mapa</title>
    <style>
      :root {
        color-scheme: dark;
        --mm-boot-bg: #060606;
        --mm-boot-text: #f3efe4;
        --mm-boot-muted: rgba(243, 239, 228, 0.68);
        --mm-boot-gold: #d6a84f;
        --mm-boot-gold-soft: rgba(214, 168, 79, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-width: 320px;
        overflow: hidden;
        background: var(--mm-boot-bg);
        color: var(--mm-boot-text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .mm-boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at center,
            rgba(214, 168, 79, 0.06),
            transparent 42%
          ),
          linear-gradient(180deg, #090909 0%, #060606 100%);
      }

      .mm-boot-core {
        display: grid;
        place-items: center;
        gap: 18px;
        width: min(82vw, 460px);
      }

      .mm-boot-logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: min(76vw, 360px);
        aspect-ratio: 1;
      }

      .mm-boot-logo-wrap::before {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(214, 168, 79, 0.08),
          transparent 68%
        );
        filter: blur(12px);
        content: "";
      }

      .mm-boot-logo {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 22px rgba(214, 168, 79, 0.12));
      }

      .mm-boot-scan {
        position: absolute;
        top: 50%;
        right: 8%;
        left: 8%;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--mm-boot-gold),
          transparent
        );
        box-shadow:
          0 0 14px rgba(214, 168, 79, 0.9),
          0 0 26px rgba(214, 168, 79, 0.35);
        transform: translateY(-50%);
        animation: mm-boot-scan 1.9s ease-in-out infinite;
      }

      .mm-boot-scan::before,
      .mm-boot-scan::after {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        border-top: 1px solid var(--mm-boot-gold);
        border-right: 1px solid var(--mm-boot-gold);
        transform: translateY(-50%) rotate(45deg);
        content: "";
      }

      .mm-boot-scan::before {
        left: 0;
      }

      .mm-boot-scan::after {
        right: 0;
      }

      .mm-boot-caption {
        margin: 0;
        color: var(--mm-boot-muted);
        font-size: clamp(12px, 2.8vw, 14px);
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      .mm-boot-screen.mm-boot-failed {
        padding: 24px;
      }

      .mm-boot-failed .mm-boot-core {
        width: min(92vw, 520px);
      }

      .mm-boot-failure-title {
        margin: 0;
        font-size: clamp(24px, 6vw, 36px);
        line-height: 1.08;
        text-align: center;
      }

      .mm-boot-failure-copy {
        margin: 0;
        color: var(--mm-boot-muted);
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
      }

      .mm-boot-retry {
        min-height: 44px;
        padding: 0 22px;
        border: 1px solid var(--mm-boot-gold);
        background: transparent;
        color: var(--mm-boot-text);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .mm-boot-retry:hover {
        background: var(--mm-boot-gold-soft);
      }

      @keyframes mm-boot-scan {
        0%,
        100% {
          transform: translateY(-50%) translateX(-4%);
          opacity: 0.6;
        }

        50% {
          transform: translateY(-50%) translateX(4%);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mm-boot-scan {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main
        id="app-boot-fallback"
        class="mm-boot-screen"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <section
          class="mm-boot-core"
          aria-label="Inicialização da plataforma Maõno Maps"
        >
          <div class="mm-boot-logo-wrap" aria-hidden="true">
            <img
              class="mm-boot-logo"
              src="/images/Simbolo_Maono.png"
              alt=""
            />
            <span class="mm-boot-scan"></span>
          </div>
          <p class="mm-boot-caption">Carregando Maõno Maps</p>
        </section>
      </main>
    </div>
    <script>
      (function () {
        function showBootFailure() {
          var fallback = document.getElementById("app-boot-fallback");
          if (!fallback || fallback.dataset.failed === "true") return;

          fallback.dataset.failed = "true";
          fallback.setAttribute("aria-busy", "false");
          fallback.classList.add("mm-boot-failed");
          fallback.innerHTML =
            '<section class="mm-boot-core" aria-label="Falha na inicialização da plataforma">' +
            '<div class="mm-boot-logo-wrap" aria-hidden="true">' +
            '<img class="mm-boot-logo" src="/images/Simbolo_Maono.png" alt="" />' +
            '</div>' +
            '<h1 class="mm-boot-failure-title">Não foi possível iniciar a plataforma.</h1>' +
            '<p class="mm-boot-failure-copy">Atualize a página. Se o problema continuar, informe o suporte da Maõno.</p>' +
            '<button class="mm-boot-retry" type="button" onclick="window.location.reload()">Tentar novamente</button>' +
            '</section>';
        }

        window.__MAONO_SHOW_BOOT_FAILURE__ = showBootFailure;
        window.__MAONO_BOOT_TIMEOUT__ = window.setTimeout(
          showBootFailure,
          12000,
        );
        window.addEventListener("error", showBootFailure, { once: true });
        window.addEventListener("unhandledrejection", showBootFailure, {
          once: true,
        });
      })();
    </script>
    <noscript>
      <div
        style="padding:24px;background:#060606;color:#f3efe4;font-family:Arial,sans-serif"
      >
        Ative o JavaScript para acessar a Maõno Maps.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
