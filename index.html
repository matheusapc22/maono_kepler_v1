<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/Simbolo_Maono.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/Simbolo_Maono.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/Simbolo_Maono.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,noimageindex,nosnippet"
    />
    <meta name="theme-color" content="#060606" />
    <title>Maõno Tecnologia | Mapa</title>
    <style>
      :root {
        color-scheme: dark;
        --mm-boot-bg: #060606;
        --mm-boot-text: #f3efe4;
        --mm-boot-muted: rgba(243, 239, 228, 0.68);
        --maono-accent-rgb: 197 160 89;
        --maono-accent: #c5a059;
        --maono-accent-muted: #8a6a2f;
        --maono-accent-strong: #d6a84f;
        --maono-accent-bright: #f2c766;
        --maono-accent-text: #f3d58a;
        --maono-accent-glow: rgb(var(--maono-accent-rgb) / 0.24);
        --maono-accent-glow-strong: rgb(var(--maono-accent-rgb) / 0.38);
        --maono-loader-size-page: 46px;
        --maono-loader-thickness-page: 4px;
        --maono-loader-duration: 1.05s;
        --mm-boot-viewport-height: 100vh;
      }

      @supports (height: 100dvh) {
        :root {
          --mm-boot-viewport-height: 100dvh;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body,
      #root {
        min-height: var(--mm-boot-viewport-height);
      }

      body {
        min-width: 320px;
        overflow-x: hidden;
        background: var(--mm-boot-bg);
        color: var(--mm-boot-text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body:has(#app-boot-fallback) {
        overflow: hidden;
      }

      .mm-loading-overlay {
        z-index: 120000;
        display: grid;
        place-items: center;
        pointer-events: auto;
        cursor: progress;
        background: transparent;
      }

      .mm-loading-overlay--viewport {
        position: fixed;
        inset: 0;
      }

      .mm-universal-loader {
        --maono-loader-size: var(--maono-loader-size-page);
        --maono-loader-thickness: var(--maono-loader-thickness-page);
        position: relative;
        display: inline-grid;
        width: var(--maono-loader-size);
        height: var(--maono-loader-size);
        flex: 0 0 auto;
        place-items: center;
        isolation: isolate;
        pointer-events: none;
      }

      .mm-universal-loader--page {
        --maono-loader-size: var(--maono-loader-size-page);
        --maono-loader-thickness: var(--maono-loader-thickness-page);
      }

      .mm-universal-loader::after {
        position: absolute;
        z-index: -1;
        left: 17%;
        right: 17%;
        bottom: -7%;
        height: 12%;
        border-radius: 999px;
        background: radial-gradient(
          ellipse at center,
          var(--maono-accent-glow-strong) 0%,
          var(--maono-accent-glow) 44%,
          transparent 74%
        );
        filter: blur(3.5px);
        opacity: 0.72;
        transform: translateY(3px) scaleX(1.08);
        content: "";
      }

      .mm-universal-loader__ring {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
          conic-gradient(
            from 12deg,
            transparent 0deg 54deg,
            rgb(var(--maono-accent-rgb) / 0.52) 72deg,
            var(--maono-accent-muted) 118deg,
            var(--maono-accent) 184deg,
            var(--maono-accent-bright) 244deg,
            var(--maono-accent-text) 274deg,
            var(--maono-accent-strong) 316deg,
            transparent 352deg 360deg
          );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--maono-loader-thickness) - 0.5px),
          #000 calc(100% - var(--maono-loader-thickness))
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - var(--maono-loader-thickness) - 0.5px),
          #000 calc(100% - var(--maono-loader-thickness))
        );
        filter:
          drop-shadow(0 1px 0 rgb(255 255 255 / 0.18))
          drop-shadow(0 5px 5px rgb(0 0 0 / 0.38))
          drop-shadow(0 0 5px var(--maono-accent-glow));
        transform-origin: 50% 50%;
        transform-style: preserve-3d;
        animation: maono-universal-loader-spin var(--maono-loader-duration)
          linear infinite;
        will-change: transform;
      }

      .mm-sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      .mm-loading-overlay.mm-boot-failed {
        padding: 24px;
        cursor: default;
      }

      .mm-boot-failed .mm-boot-failure {
        display: grid;
        width: min(92vw, 520px);
        place-items: center;
        gap: 18px;
      }

      .mm-boot-failure-title {
        margin: 0;
        font-size: clamp(24px, 6vw, 36px);
        line-height: 1.08;
        text-align: center;
      }

      .mm-boot-failure-copy {
        margin: 0;
        color: var(--mm-boot-muted);
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
      }

      .mm-boot-retry {
        min-height: 44px;
        padding: 0 22px;
        border: 1px solid var(--maono-accent-strong);
        background: transparent;
        color: var(--mm-boot-text);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .mm-boot-retry:hover {
        background: rgb(var(--maono-accent-rgb) / 0.12);
      }

      @keyframes maono-universal-loader-spin {
        from {
          transform: perspective(140px) rotateX(7deg) rotateZ(0deg);
        }

        to {
          transform: perspective(140px) rotateX(7deg) rotateZ(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mm-universal-loader__ring {
          animation: none;
          transform: perspective(140px) rotateX(7deg) rotateZ(26deg);
        }

        .mm-universal-loader::after {
          opacity: 0.56;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main
        id="app-boot-fallback"
        class="mm-loading-overlay mm-loading-overlay--viewport"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <span class="mm-universal-loader mm-universal-loader--page">
          <span class="mm-universal-loader__ring" aria-hidden="true"></span>
          <span class="mm-sr-only">Inicializando plataforma.</span>
        </span>
      </main>
    </div>
    <script>
      (function () {
        if (window.location.pathname === "/") {
          window.history.replaceState(null, "", "/login");
        }

        function showBootFailure() {
          var fallback = document.getElementById("app-boot-fallback");
          if (!fallback || fallback.dataset.failed === "true") return;

          fallback.dataset.failed = "true";
          fallback.setAttribute("aria-busy", "false");
          fallback.setAttribute("role", "alert");
          fallback.classList.add("mm-boot-failed");
          fallback.innerHTML =
            '<section class="mm-boot-failure" aria-label="Falha na inicialização da plataforma">' +
            '<h1 class="mm-boot-failure-title">Não foi possível iniciar a plataforma.</h1>' +
            '<p class="mm-boot-failure-copy">Atualize a página. Se o problema continuar, informe o suporte da Maõno.</p>' +
            '<button class="mm-boot-retry" type="button" onclick="window.location.reload()">Tentar novamente</button>' +
            "</section>";
        }

        window.__MAONO_SHOW_BOOT_FAILURE__ = showBootFailure;
        window.__MAONO_BOOT_TIMEOUT__ = window.setTimeout(
          showBootFailure,
          12000,
        );
        window.addEventListener("error", showBootFailure, { once: true });
        window.addEventListener("unhandledrejection", showBootFailure, {
          once: true,
        });
      })();
    </script>
    <noscript>
      <div
        style="padding:24px;background:#060606;color:#f3efe4;font-family:Arial,sans-serif"
      >
        Ative o JavaScript para acessar a Maõno Maps.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
